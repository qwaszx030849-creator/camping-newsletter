name: Weekly Newsletter

on:
  schedule:
    # 매주 월요일 오전 9시 KST (UTC 00:00) - 주 발급
    - cron: '0 0 * * 1'
    # 백업: 월요일 오전 11시 KST (UTC 02:00) - 첫 시도가 누락될 경우 대비
    - cron: '0 2 * * 1'
    # 백업: 월요일 오후 3시 KST (UTC 06:00)
    - cron: '0 6 * * 1'
  workflow_dispatch:  # 수동 실행도 가능

# 동일 주차 중복 실행 방지
concurrency:
  group: weekly-newsletter
  cancel-in-progress: false

jobs:
  generate-newsletter:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 저장소에 push 권한
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run newsletter pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_PRIMARY_MODEL: ${{ vars.CLAUDE_PRIMARY_MODEL || 'claude-sonnet-4-6' }}
          CLAUDE_FALLBACK_MODEL: ${{ vars.CLAUDE_FALLBACK_MODEL || 'claude-haiku-4-5-20251001' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          python main.py --skip-send
      
      - name: Upload newsletter output
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-${{ github.run_number }}
          path: output/
          retention-days: 90
      
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add output/ archive/ dashboard/public/data/ dashboard/data/archive/
          git diff --staged --quiet || git commit -m "📰 Weekly newsletter $(date +'%Y-%m-%d')"
          git push
