name: Weekly Newsletter

on:
  schedule:
    # GitHub Actions 무료 티어의 정시(:00) cron은 부하 폭증 시간대라 지연/누락이 잦음.
    # 비혼잡 분으로 분산하고, 누락 대비를 위해 월요일 다회 + 화요일 백업까지 둠.
    - cron: '17 0 * * 1'   # 월 09:17 KST (UTC 00:17) - 주 발급
    - cron: '37 2 * * 1'   # 월 11:37 KST (UTC 02:37) - 1차 백업
    - cron: '47 6 * * 1'   # 월 15:47 KST (UTC 06:47) - 2차 백업
    - cron: '23 11 * * 1'  # 월 20:23 KST (UTC 11:23) - 3차 백업
    - cron: '37 1 * * 2'   # 화 10:37 KST (UTC 01:37) - 월요일 전체 누락 대비
  workflow_dispatch:  # 수동 실행도 가능

# 동일 주차 중복 실행 방지
concurrency:
  group: weekly-newsletter
  cancel-in-progress: false

jobs:
  generate-newsletter:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 저장소에 push 권한
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run newsletter pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_PRIMARY_MODEL: ${{ vars.CLAUDE_PRIMARY_MODEL || 'claude-sonnet-4-6' }}
          CLAUDE_FALLBACK_MODEL: ${{ vars.CLAUDE_FALLBACK_MODEL || 'claude-haiku-4-5-20251001' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          python main.py --skip-send
      
      - name: Upload newsletter output
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-${{ github.run_number }}
          path: output/
          retention-days: 90
      
      - name: Commit and push changes
        id: commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add output/ archive/ dashboard/public/data/ dashboard/data/archive/
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new newsletter content to commit; skipping push."
          else
            git commit -m "📰 Weekly newsletter $(date +'%Y-%m-%d')"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Vercel rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK secret not set — dashboard will not auto-rebuild. Add it under Repo Settings → Secrets → Actions."
            exit 0
          fi
          http_code=$(curl -sS -o /tmp/vercel_resp.json -w "%{http_code}" -X POST "$VERCEL_DEPLOY_HOOK")
          echo "Vercel hook responded with HTTP $http_code"
          cat /tmp/vercel_resp.json || true
          if [ "$http_code" -ge 400 ]; then
            echo "::error::Vercel deploy hook returned $http_code"
            exit 1
          fi
