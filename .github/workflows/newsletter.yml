name: Weekly Newsletter

on:
  schedule:
    # 최근 예약 실행이 3시간 30분~5시간 지연되어 목표 발행 시각보다 일찍 시작함.
    # GitHub 지연이 반복되어도 월요일 오전 중 한 번은 완료되도록 백업 실행을 둠.
    - cron: '17 19 * * 0'  # 월 04:17 KST - 주 발행
    - cron: '37 21 * * 0'  # 월 06:37 KST - 1차 백업
    - cron: '47 23 * * 0'  # 월 08:47 KST - 2차 백업
    - cron: '23 1 * * 1'   # 월 10:23 KST - 3차 백업
    - cron: '37 21 * * 1'  # 화 06:37 KST - 월요일 전체 누락 대비
  workflow_dispatch:  # 수동 실행도 가능

# 동일 주차 중복 실행 방지
concurrency:
  group: weekly-newsletter
  cancel-in-progress: false

jobs:
  generate-newsletter:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 저장소에 push 권한
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run newsletter pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_PRIMARY_MODEL: ${{ vars.CLAUDE_PRIMARY_MODEL || 'claude-sonnet-4-6' }}
          CLAUDE_FALLBACK_MODEL: ${{ vars.CLAUDE_FALLBACK_MODEL || 'claude-haiku-4-5-20251001' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          python main.py --skip-send

      - name: Verify newsletter file was produced this run
        run: |
          python - <<'PY'
          import glob, os, sys, time
          fresh = [f for f in glob.glob('output/newsletter_*.json')
                   if time.time() - os.path.getmtime(f) < 900]
          if not fresh:
              print('::error::No fresh newsletter JSON in output/ (silent failure suspected).')
              print('Existing files:')
              for f in sorted(glob.glob('output/newsletter_*.json')):
                  print(' ', f, '(mtime', time.ctime(os.path.getmtime(f)), ')')
              sys.exit(1)
          print('OK — fresh newsletter file(s):', fresh)
          PY

      - name: Upload newsletter output
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-${{ github.run_number }}
          path: output/
          retention-days: 90
      
      - name: Commit and push changes
        id: commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add output/ archive/ dashboard/public/data/ dashboard/data/archive/
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new newsletter content to commit; skipping push."
          else
            git commit -m "📰 Weekly newsletter $(date +'%Y-%m-%d')"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Vercel rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK secret not set — dashboard will not auto-rebuild. Add it under Repo Settings → Secrets → Actions."
            exit 0
          fi
          http_code=$(curl -sS -o /tmp/vercel_resp.json -w "%{http_code}" -X POST "$VERCEL_DEPLOY_HOOK")
          echo "Vercel hook responded with HTTP $http_code"
          cat /tmp/vercel_resp.json || true
          if [ "$http_code" -ge 400 ]; then
            echo "::error::Vercel deploy hook returned $http_code"
            exit 1
          fi
